# ====================================================================
# EcoRide - environnement complet avec Docker Compose
# ====================================================================
# Prérequis : copier .env.example en .env et le compléter.
#   docker compose up -d --build     → démarre l'application
#   docker compose logs -f app       → affiche les logs
#   docker compose down -v           → arrête et supprime les données
#
# Services :
#   app   : API Express + front React compilé  → http://localhost:5000
#   db    : PostgreSQL 16 (créé avec sql/schema.sql puis sql/seed.sql)
#   mongo : MongoDB 7 (préférences des chauffeurs, journal admin)
# ====================================================================

services:
  app:
    build:
      context: .
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    container_name: ecoride_app
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgres://ecoride:${POSTGRES_PASSWORD}@db:5432/ecoride
      MONGO_URL: mongodb://mongo:27017/ecoride
      FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: ecoride_db
    environment:
      POSTGRES_DB: ecoride
      POSTGRES_USER: ecoride
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ecoride_pg:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    # Port exposé seulement sur la machine locale (pas sur le réseau)
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoride -d ecoride"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: ecoride_mongo
    volumes:
      - ecoride_mongo:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    restart: unless-stopped

volumes:
  ecoride_pg:
  ecoride_mongo:
